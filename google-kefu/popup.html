<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 340px; padding: 14px; font-family: -apple-system, sans-serif; font-size: 13px; }
    h2 { font-size: 14px; margin-bottom: 10px; color: #333; }
    .btn {
      display: block; width: 100%; padding: 9px; margin-bottom: 6px;
      color: white; border: none; border-radius: 6px;
      cursor: pointer; font-size: 13px; text-align: center;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.green { background: #34a853; }
    .btn.orange { background: #f59e0b; }
    .btn.blue { background: #3b82f6; }
    .btn.red { background: #ef4444; }
    input[type="number"] { width: 50px; padding: 4px; text-align: center; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
    input[type="password"], input[type="text"] { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; }
    textarea { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; resize: vertical; min-height: 60px; }
    .row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .section { margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
    .status { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; color: white; }
    .status.running { background: #22c55e; }
    .status.stopped { background: #94a3b8; }
    .label { font-size: 12px; color: #666; margin-bottom: 4px; }
    #log { margin-top: 8px; padding: 6px; background: #1a1a2e; border-radius: 4px; font-size: 11px; color: #0f0; font-family: monospace; max-height: 200px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <h2>Page Inspector</h2>

  <button class="btn green" id="btnID">印尼创建促销</button>
  <div class="row">
    <span>数量:</span>
    <input type="number" id="countID" value="1" min="1" max="50">
  </div>

  <div class="section">
    <button class="btn orange" id="btnPH">菲律宾创建促销</button>
    <div class="row">
      <span>数量:</span>
      <input type="number" id="countPH" value="1" min="1" max="50">
    </div>
  </div>

  <div class="section">
    <div class="row" style="justify-content: space-between;">
      <h2 style="margin:0">自动回复</h2>
      <span class="status stopped" id="arStatus">已停止</span>
    </div>
    <div class="label" style="margin-top:6px">Claude API Key</div>
    <input type="password" id="apiKey" placeholder="sk-ant-...">
    <div class="label" style="margin-top:6px">Base URL <span style="color:#aaa">(默认 https://api.anthropic.com)</span></div>
    <input type="text" id="arBaseURL" placeholder="https://api.anthropic.com">
    <div class="label" style="margin-top:6px">Model</div>
    <input type="text" id="arModel" placeholder="claude-sonnet-4-20250514" value="claude-sonnet-4-20250514">
    <div class="label" style="margin-top:6px">轮询间隔(秒)</div>
    <input type="number" id="arInterval" value="10" min="5" max="120">
    <div style="display:flex;gap:6px;margin-top:8px">
      <button class="btn blue" id="btnStartAR" style="flex:1">启动</button>
      <button class="btn red" id="btnStopAR" style="flex:1" disabled>停止</button>
    </div>
  </div>

  <div id="log">等待操作...</div>

  <script src="popup.js"></script>
</body>
</html>
